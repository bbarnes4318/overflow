<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 248 44" width="248" height="44" role="img" aria-label="Overflow Calls Messaging">
  <title>Overflow Calls Messaging</title>
  <defs>
    <linearGradient id="ocMark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Mark: a message bubble whose tail overflows past the tile edge -->
  <rect x="2" y="4" width="36" height="36" rx="11" fill="url(#ocMark)"/>
  <path d="M11.5 15.5h17a3.5 3.5 0 0 1 3.5 3.5v6.5a3.5 3.5 0 0 1-3.5 3.5h-8.2l-5.6 4.3a.8.8 0 0 1-1.3-.64V29h-1.9A3.5 3.5 0 0 1 8 25.5V19a3.5 3.5 0 0 1 3.5-3.5z"
        fill="#03211a" fill-opacity="0.92"/>
  <circle cx="14.6" cy="22.2" r="1.7" fill="#a7f3d0"/>
  <circle cx="20.0" cy="22.2" r="1.7" fill="#6ee7b7"/>
  <circle cx="25.4" cy="22.2" r="1.7" fill="#34d399"/>

  <!-- Overflow arc spilling out of the tile -->
  <path d="M34.5 10.5a13.5 13.5 0 0 1 6.6 9.2" fill="none" stroke="#34d399" stroke-opacity="0.55"
        stroke-width="2.4" stroke-linecap="round"/>

  <!-- Wordmark -->
  <text x="52" y="22.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="17" font-weight="700" letter-spacing="-0.4" fill="#f1f5f9">Overflow Calls</text>
  <text x="52.5" y="35" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="9.5" font-weight="600" letter-spacing="3.1" fill="#10b981">MESSAGING</text>
</svg>

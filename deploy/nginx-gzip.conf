# Installed by deploy.sh to /etc/nginx/conf.d/netenroll-gzip.conf (http context).
#
# nginx.conf already has `gzip on`, but without gzip_types only text/html is
# compressed. The messaging conversation list is ~8.7 MB of JSON per fetch
# (337 KB gzipped). Do not repeat `gzip on` here: it is a duplicate directive
# in the same context and fails nginx -t.
gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
gzip_proxied any;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;

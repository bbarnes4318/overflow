# $connection_upgrade: "upgrade" for a WebSocket handshake, "close" otherwise.
#
# Lives in /etc/nginx/conf.d/ because a map may only be declared in the http
# context. Defining it once here avoids editing nginx.conf, and avoids a
# duplicate-map error if another vhost already declares its own.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# netenroll.com + www.netenroll.com -> the static marketing/platform page.
#
# Installed by deploy.sh to /etc/nginx/sites-available/netenroll.com and
# symlinked into sites-enabled. certbot --nginx rewrites this file in place to
# add the TLS listener and the port-80 redirect.
#
# The messaging app is a SEPARATE vhost (messaging.netenroll.com); this one only
# serves the single static HTML file.

server {
    listen 80;
    listen [::]:80;
    server_name netenroll.com www.netenroll.com;

    root /var/www/netenroll.com;
    index index.html;

    # The public site is static HTML: index.html, aca-agent-recruiting.html,
    # licensing-value.html, one stylesheet and one script. No build output.
    #
    # $uri.html comes before the index fallback so every route is a real file
    # at an extensionless URL: /aca-agent-recruiting, /licensing-value, and the
    # legal documents /terms, /privacy, /tcpa-compliance. A consent disclosure
    # has to be citable by a carrier or a regulator, which means it needs an
    # address of its own.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # The other route files and the shared assets. A deploy must be visible on
    # the next request, not after the heuristic cache expires; revalidation is
    # a 304 and costs nothing. (deploy.sh splices this block into the live
    # vhost by its first line - keep that line unchanged.)
    location ~ ^/(aca-agent-recruiting|licensing-value|site\.css|site\.js)$ {
        try_files $uri $uri.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # "Email me my plan" on /agency-planner posts here; same handler app and
    # proxy settings as the recruiting form above.
    location = /api/planner-lead {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /agency-planner is a Vite sub-app (apps/agency-planner), built by deploy.sh
    # into the web root's agency-planner/ directory. The bare path redirects to
    # the directory, keeping any share-link query string.
    # (deploy.sh splices these three blocks into the live vhost by their first
    # lines - keep those lines unchanged.)
    location = /agency-planner {
        return 301 /agency-planner/$is_args$args;
    }

    # Asset names are content-hashed; anything else falls back to the app.
    location ^~ /agency-planner/ {
        try_files $uri /agency-planner/index.html;
    }

    # The app shell must revalidate so a deploy shows up on the next request.
    location = /agency-planner/index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Legal documents are served by path, so a stale copy is a compliance
    # problem rather than a cosmetic one. Revalidate every time.
    location ~ ^/(terms|privacy|tcpa-compliance)$ {
        try_files $uri.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # "/" is served through the index directive and never matches
    # "location = /index.html", so it needs its own block or the browser caches
    # the marketing page and a deploy appears not to have happened.
    location = / {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # The fee table the tool reads. State licensing fees change without notice,
    # so a cached copy is a wrong number rather than a stale asset.
    location = /licensing-fees.json {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # The recruiting inquiry form on /aca-agent-recruiting posts here. The
    # handler lives in the messaging Node app on the same box; proxying the
    # one path keeps the form same-origin, so there is no CORS to configure.
    location = /api/recruiting-inquiry {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/netenroll.access.log;
    error_log  /var/log/nginx/netenroll.error.log;
}

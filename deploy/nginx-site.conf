# netenroll.com + www.netenroll.com -> the static marketing/platform page.
#
# Installed by deploy.sh to /etc/nginx/sites-available/netenroll.com and
# symlinked into sites-enabled. certbot --nginx rewrites this file in place to
# add the TLS listener and the port-80 redirect.
#
# The messaging app is a SEPARATE vhost (messaging.netenroll.com); this one only
# serves the single static HTML file.

server {
    listen 80;
    listen [::]:80;
    server_name netenroll.com www.netenroll.com;

    root /var/www/netenroll.com;
    index index.html;

    # The marketing page is one self-contained HTML file that loads React and
    # Tailwind from CDNs; there is no build output and no API here.
    #
    # $uri.html comes before the index fallback so the legal documents get real,
    # extensionless URLs: /terms, /privacy, /tcpa-compliance. A consent
    # disclosure has to be citable by a carrier or a regulator, which means it
    # needs an address of its own rather than a tab inside the app.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Legal documents are served by path, so a stale copy is a compliance
    # problem rather than a cosmetic one. Revalidate every time.
    location ~ ^/(terms|privacy|tcpa-compliance)$ {
        try_files $uri.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # This page embeds https://messaging.netenroll.com in an iframe. Nothing
    # here may emit X-Frame-Options or a CSP frame-ancestors directive that
    # would fight the child frame's own headers.

    # "/" is served through the index directive and never matches
    # "location = /index.html", so it needs its own block or the browser caches
    # the marketing page and a deploy appears not to have happened.
    location = / {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # /licensing-value is an app view, not a file on disk: the try_files chain
    # above falls through to /index.html. That fallback never matches
    # "location = /index.html", so the route needs its own block for the same
    # reason "/" does, or a returning visitor keeps a cached copy of the app.
    # try_files is required here - without it nginx looks for a file named
    # "licensing-value", finds none, and 404s a route that otherwise works.
    location = /licensing-value {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # The fee table the tool reads. State licensing fees change without notice,
    # so a cached copy is a wrong number rather than a stale asset.
    location = /licensing-fees.json {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    access_log /var/log/nginx/netenroll.access.log;
    error_log  /var/log/nginx/netenroll.error.log;
}

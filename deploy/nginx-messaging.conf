# messaging.netenroll.com -> the Node app on 127.0.0.1:3100
#
# Installed by deploy.sh to /etc/nginx/sites-available/messaging.netenroll.com
# and symlinked into sites-enabled. It does NOT touch the existing
# netenroll.com server block.
#
# certbot --nginx rewrites this file in place to add the TLS listener and the
# port-80 redirect once a certificate is issued.

server {
    listen 80;
    listen [::]:80;
    server_name messaging.netenroll.com;

    # Generous: this is a messaging console, not a public form.
    client_max_body_size 8m;

    # NOTE ON HEADERS
    # This vhost deliberately emits NO X-Frame-Options and NO CSP
    # frame-ancestors directive. The marketing site embeds this app in an
    # iframe from https://netenroll.com, and either header makes that
    # frame render blank. If a server-wide default adds one, it must be
    # cleared here rather than reintroduced.
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        # WebSocket upgrade. Without these two the live queue/message stream
        # connects, immediately drops, and the dashboard silently goes stale.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # The app sets the session cookie's Secure flag from this. Without it
        # the cookie is issued unsecured over an HTTPS site.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # A WebSocket that is idle between messages must not be culled.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }
}

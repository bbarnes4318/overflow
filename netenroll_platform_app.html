        /* ---- Public marketing site: light mode component layer ---- */
        .btn-primary {

            padding: 12px 26px; border-radius: 10px;
            transition: background-color .18s ease, border-color .18s ease;
        }

        .btn-secondary:focus-visible { outline: 2px solid #078A61; outline-offset: 2px; }

        .section-title {
            font-size: clamp(1.6rem, 3.2vw, 2.15rem);
            line-height: 1.2; font-weight: 700;
            letter-spacing: -0.02em; color: #111827;
        }

        .shadow-card { box-shadow: 0 1px 2px rgba(16,24,40,.04), 0 8px 24px -12px rgba(16,24,40,.10); }

        /* Connector between the hero flow steps */
        .flow-arrow { height: 18px; position: relative; }
        .flow-arrow::before {
            content: ''; position: absolute; left: 50%; top: 0; bottom: 6px;
            width: 1px; background: #E5E7EB; transform: translateX(-50%);
        }
        .flow-arrow::after {
            content: ''; position: absolute; left: 50%; bottom: 0;
            width: 6px; height: 6px; border-right: 1px solid #E5E7EB; border-bottom: 1px solid #E5E7EB;
            transform: translateX(-50%) rotate(45deg);
        }

        /* Accordion: height transition without a layout library */
        .faq-panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .22s ease; }
        .faq-panel > * { overflow: hidden; }
        .faq-panel.faq-open { grid-template-rows: 1fr; }

        /* Subtle entrance, and nothing at all for reduced-motion users */
        .reveal { animation: reveal .5s ease both; }
        @keyframes reveal { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
        @media (prefers-reduced-motion: reduce) {
            .reveal { animation: none; }
            .faq-panel { transition: none; }
        }

        /* Mobile sticky CTA. Most traffic arrives from SMS. */
        .mobile-cta {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 45;
            background: rgba(255,255,255,.94); backdrop-filter: blur(8px);
            border-top: 1px solid #E5E7EB;
            padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
        }
        @media (min-width: 768px) { .mobile-cta { display: none; } }

<body class="bg-white text-ink min-h-screen antialiased selection:bg-brandgreen selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Security Utility: XSS Input Sanitization
        const sanitizeString = (str) => {
            if (!str) return '';
            return str.replace(/[&<>"'/]/g, (s) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;',
                '/': '&#x2F;'
            })[s]);
        };

        // Server Configured Products Registry
        const INITIAL_DB_PRODUCTS = [
            { 
                id: 'prod_fe',
                code: 'FINAL_EXPENSE',
                name: 'Final Expense Life Insurance', 
                fee: 125, 
                tagline: 'Burial & Final Expense Callers',
                description: 'Inbound senior citizens calling directly to request burial and funeral insurance quotes.',
                features: ['12-18 min average call length', 'High purchase intent seniors', '100% TCPA opt-in verified consent'],
                status: 'ACTIVE'
            },
            { 
                id: 'prod_med',
                code: 'MEDICARE',
                name: 'Medicare Advantage & Supplement', 
                fee: 175, 
                tagline: 'Eligible Medicare Beneficiaries',
                description: 'Inbound beneficiaries looking to compare plan benefits during AEP, SEP, or Turning-65 windows.',
                features: ['CMS disclaimer compliant', 'SOA & call recording friendly', 'Matched to your active state licenses'],
                status: 'ACTIVE'
            },
            { 
                id: 'prod_aca',
                code: 'ACA_HEALTH',
                name: 'ACA Health Insurance', 
                fee: 140, 
                tagline: 'Individual & Family Marketplace Shoppers',
                description: 'Inbound health insurance shoppers seeking federal subsidy qualification and plan enrollment.',
                features: ['Subsidy eligible consumers', 'Year-round OEP/SEP inbound calls', 'Fast 8-12 minute average enrollment'],
                status: 'ACTIVE'
            }
        ];

        const ALL_US_STATES = [
            'AL', 'AK', 'AZ', 'AR', 'CA', 'CO', 'CT', 'DE', 'FL', 'GA',
            'HI', 'ID', 'IL', 'IN', 'IA', 'KS', 'KY', 'LA', 'ME', 'MD',
            'MA', 'MI', 'MN', 'MS', 'MO', 'MT', 'NE', 'NV', 'NH', 'NJ',
            'NM', 'NY', 'NC', 'ND', 'OH', 'OK', 'OR', 'PA', 'RI', 'SC',
            'SD', 'TN', 'TX', 'UT', 'VT', 'VA', 'WA', 'WV', 'WI', 'WY'
        ];

        // Final-expense only. Answers describe the flow this application actually
        // implements; nothing here asserts a rate or rule that is not in
        // INITIAL_DB_PRODUCTS or the onboarding steps below.
        const FAQS = [
            {
                q: "How does NetEnroll charge me?",
                a: "NetEnroll uses a performance-based billing model. For the Final Expense program, the current rate is $125 per eligible submitted application."
            },
            {
                q: "Do I pay for every call?",
                a: "No. Calls themselves are not the billable event. The fee is triggered when an eligible application is submitted."
            },
            {
                q: "Do I need an insurance license?",
                a: "Yes. NetEnroll is designed for licensed insurance producers. Registration asks for your National Producer Number, and your account is matched to the states in which you are authorized to sell."
            },
            {
                q: "What happens when a consumer doesn't submit an application?",
                a: "You are not charged for the call simply because you spoke with the consumer."
            },
            {
                q: "Are there monthly fees?",
                a: "No. There is no monthly subscription and no separate charge for account access. Billing is limited to the per-application fee for the program you are enrolled in."
            },
            {
                q: "How quickly can I start?",
                a: "Registration is a short form: your contact details, your National Producer Number, the program you want, and a payment method. Once those steps are complete you can set your status to available and begin taking calls."
            },
            {
                q: "How are calls routed?",
                a: "Inbound calls are matched to an available agent licensed in the consumer's state and connected to the phone number on your account. Each call is recorded against your account for tracking."
            },
            {
                q: "Can agencies have multiple agents?",
                a: "Yes. An agency can have several producers on the platform, each with their own routing and their own call and application records, reported together at the agency level."
            }
        ];

        // Pricing is read from the product catalogue, never hard-coded in copy.
        const FINAL_EXPENSE_FEE = (INITIAL_DB_PRODUCTS.find(p => p.code === 'FINAL_EXPENSE') || {}).fee;

        const CheckMark = () => (
            <svg className="w-4 h-4 mt-0.5 shrink-0 text-brandgreen" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                <path d="M4.5 10.5l3.2 3.2 7.8-7.8" stroke="currentColor" strokeWidth="2"
                      strokeLinecap="round" strokeLinejoin="round" />
            </svg>
        );

        const PlusMark = () => (
            <svg className="w-4 h-4 text-muted" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M8 3v10M3 8h10" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" />
            </svg>
        );

        function NetEnrollApp() {
            // Navigation States
            const [currentTab, setCurrentTab] = useState('marketing');
            const [dashSubTab, setDashSubTab] = useState('overview');
            const [adminSubTab, setAdminSubTab] = useState('overview');

            const [selectedVertical, setSelectedVertical] = useState('Final Expense Life Insurance');
            const [openFaq, setOpenFaq] = useState(0);
            const [mobileNavOpen, setMobileNavOpen] = useState(false);

            // The public marketing site is light mode. The authenticated portals
            // keep their existing dark surface, so chrome shared between them
            // switches on this one flag rather than being duplicated.
            const isPublic = currentTab === 'marketing';

            // Dynamic Database Products Registry
            const [dbProducts, setDbProducts] = useState(INITIAL_DB_PRODUCTS);

            // Role State
            const [currentUserRole, setCurrentUserRole] = useState('AGENT');

            // Filters & Search
            const [callFilterVertical, setCallFilterVertical] = useState('ALL');
            const [appSearchQuery, setAppSearchQuery] = useState('');
            const [adminAgentSearch, setAdminAgentSearch] = useState('');
            const [adminAgentStatusFilter, setAdminAgentSearchStatus] = useState('ALL');

            // Telephony Interactive State
            const [agentStatus, setAgentStatus] = useState('AVAILABLE');
            const [activeCall, setActiveCall] = useState(null);

            // Onboarding Engine State
            const [onboardingStep, setOnboardingStep] = useState(1);
            const [onboardingError, setOnboardingError] = useState('');
            const [isVerifyingNPN, setIsVerifyingNPN] = useState(false);

            // Rate Limit Counter (Security)
            const [requestCount, setRequestCount] = useState(0);

            // Active Authenticated Agent Profile
            const [agentProfile, setAgentProfile] = useState({
                id: 'ag_8849201',
                firstName: 'Marcus',
                lastName: 'Vance',
                email: 'marcus@vanceinsurance.com',
                phone: '+1 (555) 234-5678',
                agencyName: 'Vance Financial Group',
                npn: '1849201',
                npnVerified: true,
                licensedStates: ['TX', 'FL', 'GA', 'NC', 'OH'],
                selectedPrograms: ['prod_fe', 'prod_med'],
                dailyMaxTarget: 5,
                stripeCustomerId: 'cus_P9201489210',
                stripePaymentMethodId: 'pm_1N9283401923',
                cardLast4: '4242',
                cardBrand: 'Visa',
                paymentStatus: 'CURRENT',
                accountStatus: 'ACTIVE'
            });

            // Master Directory
            const [masterAgentDirectory, setMasterAgentDirectory] = useState([
                { id: 'ag_8849201', name: 'Marcus Vance', email: 'marcus@vanceinsurance.com', agency: 'Vance Financial Group', npn: '1849201', states: ['TX', 'FL', 'GA', 'NC', 'OH'], status: 'ACTIVE', paymentStatus: 'CURRENT', createdAt: '2026-02-15' },
                { id: 'ag_9901822', name: 'Sarah Jenkins', email: 'sarah@jenkinsbenefits.com', agency: 'Jenkins Financial', npn: '1940291', states: ['NC', 'SC', 'VA'], status: 'ACTIVE', paymentStatus: 'CURRENT', createdAt: '2026-02-18' },
                { id: 'ag_7740192', name: 'David Ross', email: 'david@crosscountryins.com', agency: 'Ross Insurance Group', npn: '1720194', states: ['CA', 'AZ', 'NV'], status: 'PENDING_VERIFICATION', paymentStatus: 'UNVERIFIED', createdAt: '2026-03-01' }
            ]);

            // Applications Database Table
            const [applications, setApplications] = useState([
                { id: 'APP-9982', callId: 'CALL-501', agentId: 'ag_8849201', agentName: 'Marcus Vance', vertical: 'Final Expense Life Insurance', carrier: 'Mutual of Omaha', policyNum: 'FE-8849201', applicant: 'Robert Miller', state: 'TX', fee: 125, paymentIntentId: 'pi_3M9284019231', status: 'SETTLED', billableStatus: 'BILLABLE', time: '10:42 AM', date: '2026-03-02' },
                { id: 'APP-9983', callId: 'CALL-498', agentId: 'ag_8849201', agentName: 'Marcus Vance', vertical: 'Medicare Advantage & Supplement', carrier: 'Humana', policyNum: 'MED-993021', applicant: 'Dorothy Kowalski', state: 'NC', fee: 175, paymentIntentId: 'pi_3M9284019232', status: 'SETTLED', billableStatus: 'BILLABLE', time: '11:15 AM', date: '2026-03-02' },
                { id: 'APP-9984', callId: 'CALL-480', agentId: 'ag_9901822', agentName: 'Sarah Jenkins', vertical: 'Medicare Advantage & Supplement', carrier: 'Aetna', policyNum: 'MED-102938', applicant: 'James Thornton', state: 'NC', fee: 175, paymentIntentId: 'pi_3M9284019233', status: 'SETTLED', billableStatus: 'BILLABLE', time: '02:30 PM', date: '2026-03-01' }
            ]);

            // Call Logs Table
            const [callLogs, setCallLogs] = useState([
                { id: 'CALL-501', agentId: 'ag_8849201', caller: '+1 (214) ***-8812', state: 'TX', vertical: 'Final Expense Life Insurance', campaign: 'FE_Seniors_TV_Q1', duration: '14m 22s', outcome: 'APPLICATION_WRITTEN', time: '10:28 AM', date: '2026-03-02' },
                { id: 'CALL-502', agentId: 'ag_8849201', caller: '+1 (407) ***-3319', state: 'FL', vertical: 'Final Expense Life Insurance', campaign: 'FE_Seniors_Digital', duration: '03m 12s', outcome: 'DISQUALIFIED', time: '11:04 AM', date: '2026-03-02' },
                { id: 'CALL-503', agentId: 'ag_9901822', caller: '+1 (704) ***-1102', state: 'NC', vertical: 'Medicare Advantage & Supplement', campaign: 'MED_Advantage_TV', duration: '12m 40s', outcome: 'APPLICATION_WRITTEN', time: '02:18 PM', date: '2026-03-01' }
            ]);

            // Webhook Audit Logs
            const [webhookLogs, setWebhookLogs] = useState([
                { id: 'evt_1N901021', type: 'payment_intent.succeeded', intentId: 'pi_3M9284019231', amount: 125, status: 'PROCESSED', timestamp: '10:42 AM', signatureValid: true }
            ]);

            // Audit Trail Logs
            const [auditLogs, setAuditLogs] = useState([
                { id: 'aud_101', admin: 'admin_root', action: 'PROGRAM_PRICE_UPDATE', resource: 'prod_med', metadata: 'Medicare Rate set to $175', timestamp: '2026-03-01 09:12 AM' }
            ]);

            // Automated Security Test Suite Logs
            const [secTestResults, setSecTestResults] = useState([]);

            // The "Run Stripe Tests" button in the Admin portal referenced both
            // `runStripeTestSuite` and `testResults`, and neither was ever
            // defined. Two undefined identifiers in the render path took the
            // whole Admin portal down with a blank screen. Declared here.
            const [testResults, setTestResults] = useState([]);

            // Modal & Notifications
            const [showAppModal, setShowAppModal] = useState(false);
            const [isProcessingPayment, setIsProcessingPayment] = useState(false);
            const [billingError, setBillingError] = useState('');
            const [appFormData, setAppFormData] = useState({ carrier: 'Mutual of Omaha', policyNumber: '', applicantFirstName: '', applicantLastName: '', applicantState: 'TX' });
            const [flashMessage, setFlashMessage] = useState('');

            const showNotification = (msg) => {
                setFlashMessage(msg);
                setTimeout(() => setFlashMessage(''), 4000);
            };

            const logAdminAuditAction = (action, resource, metadata) => {
                const newAudit = {
                    id: 'aud_' + Math.floor(Math.random() * 899 + 100),
                    admin: 'admin_exec',
                    action,
                    resource,
                    metadata,
                    timestamp: new Date().toISOString().replace('T', ' ').substring(0, 19)
                };
                setAuditLogs(prev => [newAudit, ...prev]);
            };

            const scrollToSection = (id) => {
                if (currentTab !== 'marketing') {
                    setCurrentTab('marketing');
                    setTimeout(() => {
                        const el = document.getElementById(id);
                        if (el) el.scrollIntoView({ behavior: 'smooth' });
                    }, 100);
                } else {
                    const el = document.getElementById(id);
                    if (el) el.scrollIntoView({ behavior: 'smooth' });
                }
                setMobileNavOpen(false);
            };

            // SECURITY SERVER AUTHORIZATION GUARD (Simulated Backend Middleware)
            const authorizeTenantAccess = (requestedAgentId) => {
                if (currentUserRole === 'ADMIN') return true; // Admins are authorized globally
                return requestedAgentId === agentProfile.id; // Agents can strictly access their own tenant scope
            };

            // Onboarding Handlers
            const handleStep1Submit = (e) => { e.preventDefault(); setOnboardingStep(2); };
            const handleStep2Submit = (e) => {
                e.preventDefault();
                setIsVerifyingNPN(true);
                setTimeout(() => {
                    setIsVerifyingNPN(false);
                    setAgentProfile(prev => ({ ...prev, npnVerified: true }));
                    setOnboardingStep(3);
                }, 1000);
            };
            const handleStep3Submit = (e) => { e.preventDefault(); setOnboardingStep(4); };
            const handleStep4Submit = (e) => {
                e.preventDefault();
                setOnboardingStep(5);
                setTimeout(() => setAgentProfile(prev => ({ ...prev, accountStatus: 'ACTIVE', paymentStatus: 'CURRENT' })), 1200);
            };

            const toggleStateSelection = (st) => {
                setAgentProfile(prev => {
                    const exists = prev.licensedStates.includes(st);
                    return { ...prev, licensedStates: exists ? prev.licensedStates.filter(s => s !== st) : [...prev.licensedStates, st] };
                });
            };

            const toggleProgramSelection = (progId) => {
                setAgentProfile(prev => {
                    const exists = prev.selectedPrograms.includes(progId);
                    return { ...prev, selectedPrograms: exists ? prev.selectedPrograms.filter(p => p !== progId) : [...prev.selectedPrograms, progId] };
                });
            };

            // Telephony Simulation
            const simulateIncomingCall = () => {
                if (agentStatus !== 'AVAILABLE' || agentProfile.paymentStatus === 'RESTRICTED') return;
                setAgentStatus('ON_CALL');
                const randomState = agentProfile.licensedStates[Math.floor(Math.random() * agentProfile.licensedStates.length)] || 'TX';
                setActiveCall({
                    id: 'CALL-' + Math.floor(Math.random() * 899 + 100),
                    callerId: `+1 (${Math.floor(Math.random()*800+200)}) ***-${Math.floor(Math.random()*8999+1000)}`,
                    state: randomState,
                    vertical: selectedVertical,
                    startTime: new Date()
                });
            };

            const endCall = (wasWritten) => {
                if (wasWritten) {
                    setShowAppModal(true);
                } else {
                    if (activeCall) {
                        setCallLogs(prev => [{
                            id: activeCall.id,
                            agentId: agentProfile.id,
                            caller: activeCall.callerId,
                            state: activeCall.state,
                            vertical: activeCall.vertical,
                            campaign: 'Inbound_Direct',
                            duration: '04m 12s',
                            outcome: 'DISQUALIFIED',
                            time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                            date: '2026-03-03'
                        }, ...prev]);
                    }
                    setActiveCall(null);
                    setAgentStatus('AVAILABLE');
                    showNotification('Call disconnected. $0 charged (No policy written).');
                }
            };

            // HARDENED SERVER BILLING SERVICE (With Idempotency, Rate Limiting & Input Sanitization)
            const executeSecureServerBilling = (verticalName, policyNum, agentId, idempotencyKey) => {
                // Rate Limiting Guard
                if (requestCount > 10) {
                    return { success: false, error: 'Rate limit exceeded. Too many requests. Please wait 60 seconds.' };
                }
                setRequestCount(prev => prev + 1);

                // Tenant Isolation Verification
                if (!authorizeTenantAccess(agentId)) {
                    return { success: false, error: '403 Forbidden: Tenant data isolation boundary breach detected.' };
                }

                // Sanitize Inputs
                const sanitizedPolicy = sanitizeString(policyNum);

                // Anti-Duplicate Policy Check
                if (applications.some(a => a.policyNum.toUpperCase() === sanitizedPolicy.toUpperCase())) {
                    return { success: false, error: `Duplicate policy number detected (${sanitizedPolicy}). Transaction blocked.` };
                }

                // Server Pricing Lookup
                const matched = dbProducts.find(p => p.name === verticalName) || dbProducts[0];
                const piId = 'pi_' + Math.random().toString(36).substring(2, 14);

                return { 
                    success: true, 
                    fee: matched.fee, 
                    paymentIntentId: piId, 
                    vertical: matched.name,
                    sanitizedPolicyNumber: sanitizedPolicy
                };
            };

            const handleAppSubmit = (e) => {
                e.preventDefault();
                setIsProcessingPayment(true);
                setBillingError('');

                setTimeout(() => {
                    const res = executeSecureServerBilling(
                        activeCall?.vertical || selectedVertical, 
                        appFormData.policyNumber || ('POL-' + Math.floor(Math.random() * 899900 + 100000)),
                        agentProfile.id,
                        'idemp_' + Math.random().toString(36).substring(2, 10)
                    );

                    setIsProcessingPayment(false);

                    if (!res.success) {
                        setBillingError(res.error);
                        return;
                    }

                    const newApp = {
                        id: 'APP-' + Math.floor(Math.random() * 8999 + 1000),
                        callId: activeCall?.id || 'CALL-000',
                        agentId: agentProfile.id,
                        agentName: `${sanitizeString(agentProfile.firstName)} ${sanitizeString(agentProfile.lastName)}`,
                        vertical: res.vertical,
                        carrier: sanitizeString(appFormData.carrier),
                        policyNum: res.sanitizedPolicyNumber,
                        applicant: `${sanitizeString(appFormData.applicantFirstName || 'John')} ${sanitizeString(appFormData.applicantLastName || 'Doe')}`,
                        state: sanitizeString(appFormData.applicantState),
                        fee: res.fee,
                        paymentIntentId: res.paymentIntentId,
                        status: 'SETTLED',
                        billableStatus: 'BILLABLE',
                        time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                        date: '2026-03-03'
                    };

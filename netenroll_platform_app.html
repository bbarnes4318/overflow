                                                <select value={adminAgentStatusFilter} onChange={e => setAdminAgentSearchStatus(e.target.value)} className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-purple-500">
                                                    <option value="ALL">All Statuses</option>
                                                    <option value="ACTIVE">ACTIVE</option>
                                                    <option value="PENDING_VERIFICATION">PENDING_VERIFICATION</option>
                                                    <option value="SUSPENDED">SUSPENDED</option>
                                                </select>
                                            </div>
                                        </div>

                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left text-xs text-slate-300">
                                                <thead className="bg-slate-950 text-slate-400 uppercase font-mono border-b border-slate-800">
                                                    <tr>
                                                        <th className="p-3">Agent ID / Entity</th>
                                                        <th className="p-3">Full Name / Email</th>
                                                        <th className="p-3">Agency Name</th>
                                                        <th className="p-3">Active States</th>
                                                        <th className="p-3">Account Status</th>
                                                        <th className="p-3">Payment Vault</th>
                                                        <th className="p-3">Admin Action</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-800/60 font-mono">
                                                    {filteredMasterAgents.map(ag => (
                                                        <tr key={ag.id} className="hover:bg-slate-950/50">
                                                            <td className="p-3">
                                                                <div className="font-bold text-white">{ag.id}</div>
                                                                <div className="text-[10px] text-slate-500">{ag.accountType === 'COMPANY' ? `${ag.entityType} · ${ag.entityState}` : 'Individual Agent'}</div>
                                                            </td>
                                                            <td className="p-3 font-sans">
                                                                <div className="font-bold text-slate-100">{ag.name}</div>
                                                                <div className="text-[10px] text-slate-400">{ag.email}</div>
                                                            </td>
                                                            <td className="p-3 text-slate-300">{ag.agency}</td>
                                                            <td className="p-3 text-emerald-400">{ag.states.join(', ')}</td>
                                                            <td className="p-3">
                                                                <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${ag.status === 'ACTIVE' ? 'bg-emerald-500/10 text-emerald-400' : ag.status === 'SUSPENDED' ? 'bg-red-500/10 text-red-400' : 'bg-amber-500/10 text-amber-400'}`}>
                                                                    {ag.status}
                                                                </span>
                                                            </td>
                                                            <td className="p-3 text-slate-400">{ag.paymentStatus}</td>
                                                            <td className="p-3">
                                                                {ag.status === 'ACTIVE' ? (
                                                                    <button onClick={() => setAdminAgentStatus(ag.id, 'SUSPENDED')} className="bg-red-500/20 hover:bg-red-500/30 text-red-300 border border-red-500/30 px-2.5 py-1 rounded text-[10px] font-bold">
                                                                        Suspend Routing
                                                                    </button>
                                                                ) : (
                                                                    <button onClick={() => setAdminAgentStatus(ag.id, 'ACTIVE')} className="bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-300 border border-emerald-500/30 px-2.5 py-1 rounded text-[10px] font-bold">
                                                                        Approve & Activate
                                                                    </button>
                                                                )}
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}

                                {adminSubTab === 'programs' && (
                                    <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-6">
                                        <div>
                                            <h3 className="font-bold text-white text-lg">Dynamic Program Pricing Engine</h3>
                                            <p className="text-xs text-slate-400 mt-1">Configure vertical pricing rules. Rates updated here instantly bind to server billing verification.</p>
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                            {dbProducts.map(prod => (
                                                <div key={prod.id} className="p-6 rounded-2xl bg-slate-950 border border-slate-800 space-y-4">
                                                    <div className="flex items-center justify-between">
                                                        <span className="font-bold text-base text-white">{prod.name}</span>
                                                        <span className="bg-emerald-500/10 text-emerald-400 text-[10px] font-mono px-2 py-0.5 rounded">ONLINE</span>
                                                    </div>

                                                    <div className="space-y-2">
                                                        <label className="block text-[10px] font-mono text-slate-400 uppercase">Application Rate Fee ($ USD)</label>
                                                        <div className="flex items-center gap-2">
                                                            <span className="text-lg font-bold text-white">$</span>
                                                            <input type="number" defaultValue={prod.fee} onBlur={(e) => updateProductPrice(prod.id, e.target.value)} className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs font-mono text-white outline-none focus:border-purple-500" />
                                                        </div>
                                                    </div>

                                                    <p className="text-xs text-slate-400">{prod.description}</p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {adminSubTab === 'applications' && (
                                    <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4">
                                        <div className="flex items-center justify-between">
                                            <h3 className="font-bold text-white text-sm">All Policy Applications Submitted</h3>
                                            <span className="text-xs font-mono text-slate-400">{applications.length} Applications</span>
                                        </div>

                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left text-xs text-slate-300">
                                                <thead className="bg-slate-950 text-slate-400 uppercase font-mono border-b border-slate-800">
                                                    <tr>
                                                        <th className="p-3">Ref ID</th>
                                                        <th className="p-3">Agent Name</th>
                                                        <th className="p-3">Carrier / Policy</th>
                                                        <th className="p-3">Stripe Intent Hash</th>
                                                        <th className="p-3">Amount</th>
                                                        <th className="p-3">Status</th>
                                                        <th className="p-3">Governance Action</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-800/60 font-mono">
                                                    {applications.map(app => (
                                                        <tr key={app.id} className="hover:bg-slate-950/50">
                                                            <td className="p-3 font-bold text-white">{app.id}</td>
                                                            <td className="p-3 font-sans text-slate-200">{app.agentName}</td>
                                                            <td className="p-3">{app.carrier} - {app.policyNum}</td>
                                                            <td className="p-3 text-slate-500">{app.paymentIntentId}</td>
                                                            <td className="p-3 font-bold text-emerald-400">${app.fee}</td>
                                                            <td className="p-3">
                                                                <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${app.status === 'SETTLED' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-red-500/10 text-red-400'}`}>
                                                                    {app.status}
                                                                </span>
                                                            </td>
                                                            <td className="p-3">
                                                                {app.status === 'SETTLED' ? (
                                                                    <button onClick={() => issueRefund(app.id, app.paymentIntentId)} className="bg-red-500/20 hover:bg-red-500/30 text-red-300 border border-red-500/30 px-3 py-1 rounded text-[10px] font-bold">
                                                                        Issue Stripe Refund
                                                                    </button>
                                                                ) : (
                                                                    <span className="text-[10px] text-slate-500">Refund Billed</span>
                                                                )}
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}

                                {adminSubTab === 'calls' && (
                                    <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4">
                                        <div className="flex items-center justify-between">
                                            <h3 className="font-bold text-white text-sm">System Telephony Call Stream</h3>
                                            <span className="text-xs font-mono text-emerald-400">$0 Call Cost Enforced</span>
                                        </div>

                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left text-xs text-slate-300">
                                                <thead className="bg-slate-950 text-slate-400 uppercase font-mono border-b border-slate-800">
                                                    <tr>
                                                        <th className="p-3">Call ID</th>
                                                        <th className="p-3">Timestamp</th>
                                                        <th className="p-3">Caller ID</th>
                                                        <th className="p-3">Vertical / Campaign</th>
                                                        <th className="p-3">Duration</th>
                                                        <th className="p-3">Outcome</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-800/60 font-mono">
                                                    {callLogs.map(c => (
                                                        <tr key={c.id} className="hover:bg-slate-950/50">
                                                            <td className="p-3 font-bold text-white">{c.id}</td>
                                                            <td className="p-3 text-slate-400">{c.date} {c.time}</td>
                                                            <td className="p-3 text-slate-200">{c.caller} ({c.state})</td>
                                                            <td className="p-3">{c.vertical} ({c.campaign})</td>
                                                            <td className="p-3">{c.duration}</td>
                                                            <td className="p-3">
                                                                <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${c.outcome === 'APPLICATION_WRITTEN' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-slate-800 text-slate-400'}`}>
                                                                    {c.outcome}
                                                                </span>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}

                                {adminSubTab === 'audit' && (
                                    <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4">
                                        <div className="flex items-center justify-between">
                                            <h3 className="font-bold text-white text-sm flex items-center gap-2">
                                                <i className="fa-solid fa-file-shield text-purple-400"></i> Administrative Action Audit Log
                                            </h3>
                                            <span className="text-xs font-mono text-slate-400">Immutable Compliance Trail</span>
                                        </div>

                                        <div className="space-y-2.5 font-mono text-xs">
                                            {auditLogs.map(a => (
                                                <div key={a.id} className="p-3 bg-slate-950 border border-slate-800 rounded-xl flex items-center justify-between">
                                                    <div className="space-y-0.5">
                                                        <div className="flex items-center gap-2">
                                                            <span className="text-purple-400 font-bold">{a.action}</span>
                                                            <span className="text-slate-500">• Target: {a.resource}</span>
                                                        </div>
                                                        <div className="text-slate-300 font-sans text-xs">{a.metadata}</div>
                                                    </div>
                                                    <div className="text-right text-[10px] text-slate-500">
                                                        <div>{a.timestamp}</div>
                                                        <div>{a.admin}</div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                            </div>
                        )}
                    </main>

                    {/* SUBMIT APPLICATION MODAL */}
                    {showAppModal && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-md w-full p-6 space-y-6 shadow-2xl">
                                <div className="flex items-center justify-between border-b border-slate-800 pb-4">
                                    <h3 className="text-base font-bold text-white flex items-center gap-2">
                                        <i className="fa-solid fa-file-circle-check text-emerald-400"></i> Log Policy Application
                                    </h3>
                                    <button onClick={() => setShowAppModal(false)} className="text-slate-400 hover:text-white">
                                        <i className="fa-solid fa-xmark text-lg"></i>
                                    </button>
                                </div>

                                {billingError && (
                                    <div className="p-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-xs flex items-center gap-2">
                                        <i className="fa-solid fa-triangle-exclamation"></i>
                                        <span>{billingError}</span>
                                    </div>
                                )}

                                <form onSubmit={handleAppSubmit} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">Insurance Carrier</label>
                                        <select value={appFormData.carrier} onChange={e => setAppFormData({...appFormData, carrier: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white outline-none focus:border-emerald-500">
                                            <option>Mutual of Omaha</option>
                                            <option>Aetna / Continental Life</option>
                                            <option>Humana</option>
                                            <option>Ambetter / Centene</option>
                                            <option>UnitedHealthcare</option>
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">Policy / Application Submission # *</label>
                                        <input type="text" required placeholder="e.g. FE-990421" value={appFormData.policyNumber} onChange={e => setAppFormData({...appFormData, policyNumber: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white outline-none focus:border-emerald-500 font-mono" />
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">Applicant First Name</label>
                                            <input type="text" required placeholder="Robert" value={appFormData.applicantFirstName} onChange={e => setAppFormData({...appFormData, applicantFirstName: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white outline-none focus:border-emerald-500" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">Applicant State</label>
                                            <input type="text" required placeholder="TX" value={appFormData.applicantState} onChange={e => setAppFormData({...appFormData, applicantState: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white outline-none focus:border-emerald-500 font-mono" />
                                        </div>
                                    </div>

                                    <div className="p-3 bg-emerald-500/10 border border-emerald-500/20 rounded-xl text-xs text-slate-300 space-y-1">
                                        <div className="font-bold text-emerald-400">Billing Notice:</div>
                                        <div>Submitting this application draws one application from your prepaid balance at ${FINAL_EXPENSE_FEE} per application.</div>
                                    </div>

                                    <button type="submit" disabled={isProcessingPayment} className="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-3.5 rounded-xl text-xs transition shadow-lg shadow-emerald-500/20 uppercase tracking-wider flex items-center justify-center gap-2">
                                        {isProcessingPayment ? (
                                            <>
                                                <i className="fa-solid fa-spinner fa-spin"></i>
                                                <span>Executing Stripe Charge...</span>
                                            </>
                                        ) : (
                                            <span>Confirm Policy Application Submission</span>
                                        )}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Mobile sticky CTA. Most traffic arrives from SMS on a phone,
                        so the primary action stays reachable without scrolling back. */}
                    {isPublic && showStickyCta && (
                        <div className="mobile-cta">
                            <button onClick={startSignup} className="btn-primary w-full">
                                Start Receiving Calls
                            </button>
                        </div>
                    )}

                    {/* FOOTER */}
                    {isPublic ? (
                        <footer className="border-t border-line bg-white">
                            <div className="max-w-[1180px] mx-auto px-5 sm:px-6 py-14">
                                <div className="grid gap-10 md:grid-cols-[1.4fr_1fr_1fr_1fr]">
                                    <div>
                                        <Wordmark className="h-[24px] w-auto" />
                                        <p className="mt-4 text-sm leading-relaxed text-muted max-w-xs">
                                            Performance-based final expense call distribution for licensed
                                            insurance professionals.
                                        </p>
                                    </div>

                                    <div>
                                        <h3 className="text-[13px] font-semibold text-ink">Products</h3>
                                        <ul className="mt-4 space-y-2.5 text-sm text-muted">
                                            <li><button onClick={() => scrollToSection('final-expense')} className="hover:text-ink transition-colors">Final Expense</button></li>
                                        </ul>
                                    </div>

                                    <div>
                                        <h3 className="text-[13px] font-semibold text-ink">Company</h3>
                                        <ul className="mt-4 space-y-2.5 text-sm text-muted">
                                            <li><button onClick={() => scrollToSection('how-it-works')} className="hover:text-ink transition-colors">How It Works</button></li>
                                            <li><button onClick={() => scrollToSection('pricing')} className="hover:text-ink transition-colors">Pricing</button></li>
                                            <li><button onClick={() => scrollToSection('faq')} className="hover:text-ink transition-colors">FAQ</button></li>
                                            <li><button onClick={() => scrollToSection('faq')} className="hover:text-ink transition-colors">Contact</button></li>
                                        </ul>
                                    </div>

                                    <div>
                                        <h3 className="text-[13px] font-semibold text-ink">Legal</h3>
                                        <ul className="mt-4 space-y-2.5 text-sm text-muted">
                                            <li><a href="/terms" className="hover:text-ink transition-colors">Terms of Service</a></li>
                                            <li><a href="/privacy" className="hover:text-ink transition-colors">Privacy Policy</a></li>
                                            <li><a href="/tcpa-compliance" className="hover:text-ink transition-colors">TCPA &amp; Compliance</a></li>
                                        </ul>
                                    </div>
                                </div>

                                <div className="mt-12 pt-7 border-t border-line flex flex-col sm:flex-row gap-3 sm:items-center sm:justify-between">
                                    <p className="text-[13px] text-muted">© 2026 PVN LLC. All rights reserved. NetEnroll is a service of PVN LLC.</p>
                                    <address className="not-italic text-[13px] text-muted sm:text-right">
                                        2800 N 6th Street #796, Saint Augustine, FL 32084
                                        <span className="hidden sm:inline"> &middot; </span>
                                        <a href="tel:+19045128487" className="block sm:inline hover:text-ink transition-colors">904-512-8487</a>
                                    </address>
                                </div>
                            </div>
                        </footer>
                    ) : (
                        <footer className="border-t border-slate-800 bg-slate-950 py-8 text-xs text-slate-500">
                            <div className="max-w-7xl mx-auto px-5 sm:px-6 flex flex-col sm:flex-row gap-2 sm:items-center sm:justify-between">
                                <span>© 2026 PVN LLC</span>
                                <button onClick={() => setCurrentTab('marketing')} className="hover:text-slate-300 transition-colors text-left">Back to netenroll.com</button>
                            </div>
                        </footer>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<NetEnrollApp />);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Expense Calls | Pay Per Application | NetEnroll</title>
    <meta name="description" content="Final expense calls for licensed insurance agents. No traditional per-call charge - you pay when an eligible insurance application is submitted. $199 per submitted application, no minimum purchase.">
    <meta name="theme-color" content="#FFFFFF">
    <link rel="canonical" href="https://netenroll.com/">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // Marketing palette. Light mode only on the public site.
                        ink: '#111827',
                        muted: '#667085',
                        line: '#E6E9ED',
                        soft: '#F8FAF9',
                        mint: '#ECFDF5',
                        brandgreen: '#10B981',
                        deepgreen: '#087F5B',
                        brand: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            400: '#34d399',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            900: '#064e3b',
                            950: '#022c22'
                        },
                        dark: {
                            800: '#0f172a',
                            900: '#020617',
                            950: '#010409'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Fira Code', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        /* =========================================================
           Public marketing site — light mode component layer.
           Type scale is deliberately large: this page is read once,
           in about five seconds, usually on a phone from an SMS link.
           ========================================================= */

        /* Sticky header is 72px; anchors must clear it. */
        section[id] { scroll-margin-top: 82px; }

        .btn-primary {
            display: inline-flex; align-items: center; justify-content: center;
            background: #10B981; color: #fff;
            font-weight: 600; font-size: 16px; letter-spacing: -0.005em;
            padding: 15px 30px; border-radius: 10px;
            box-shadow: 0 1px 2px rgba(16,24,40,.05), 0 6px 16px -8px rgba(16,185,129,.55);
            transition: background-color .18s ease, transform .12s ease, box-shadow .18s ease;
        }
        .btn-primary:hover { background: #087F5B; box-shadow: 0 1px 2px rgba(16,24,40,.05), 0 10px 22px -10px rgba(8,127,91,.6); }
        .btn-primary:active { transform: translateY(1px); }
        .btn-primary:focus-visible { outline: 2px solid #087F5B; outline-offset: 3px; }
        .btn-primary.btn-lg { font-size: 17px; padding: 18px 36px; border-radius: 11px; }

        .btn-secondary {
            display: inline-flex; align-items: center; justify-content: center;
            background: #fff; color: #111827; border: 1px solid #E6E9ED;
            font-weight: 600; font-size: 16px;
            padding: 14px 28px; border-radius: 10px;
            transition: background-color .18s ease, border-color .18s ease;
        }
        .btn-secondary:hover { background: #F8FAF9; border-color: #D3D8DE; }
        .btn-secondary:focus-visible { outline: 2px solid #087F5B; outline-offset: 3px; }

        /* ---- Type scale. Never combine these with Tailwind text-* sizes. ---- */
        .eyebrow {
            font-size: 12.5px; font-weight: 600; letter-spacing: 0.15em;
            text-transform: uppercase; color: #087F5B;
        }
        .t-h1 {
            /* 58-64px on desktop, 38-44px on a phone. Larger than this and
               the headline alone pushes the price below the fold. */
            font-size: clamp(2.4rem, 4.6vw, 3.75rem);
            line-height: 1.05; letter-spacing: -0.033em;
            font-weight: 700; color: #111827;
        }
        .t-h2 {
            font-size: clamp(1.9rem, 3.3vw, 2.6rem);
            line-height: 1.12; letter-spacing: -0.028em;
            font-weight: 700; color: #111827;
        }
        .t-h3 { font-size: clamp(1.25rem, 1.9vw, 1.55rem); line-height: 1.25; letter-spacing: -0.02em; font-weight: 650; color: #111827; }
        .t-lede { font-size: clamp(1.05rem, 1.25vw, 1.16rem); line-height: 1.6; color: #667085; }
        .t-body { font-size: 16px; line-height: 1.62; color: #667085; }

        /* Numerals: tabular so stacked money columns line up. */
        .num { font-variant-numeric: tabular-nums; letter-spacing: -0.035em; }

        .card { background: #fff; border: 1px solid #E6E9ED; border-radius: 16px; }
        .shadow-card { box-shadow: 0 1px 2px rgba(16,24,40,.04), 0 10px 30px -14px rgba(16,24,40,.14); }
        .shadow-lift { box-shadow: 0 1px 3px rgba(16,24,40,.05), 0 24px 56px -24px rgba(16,24,40,.22); }
        .card-hover { transition: box-shadow .2s ease, border-color .2s ease; }
        .card-hover:hover { border-color: #D3D8DE; box-shadow: 0 1px 2px rgba(16,24,40,.04), 0 14px 34px -16px rgba(16,24,40,.18); }

        /* The rule that links the numbered steps on desktop */
        .step-rule { position: relative; }
        @media (min-width: 1024px) {
            .step-rule::before {
                content: ''; position: absolute; left: 0; right: 0; top: 23px;
                height: 1px; background: #E6E9ED;
            }
        }

        /* Accordion: height transition without a layout library */
        .faq-panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .22s ease; }
        /* min-height:0 and no padding on this element, or the track cannot
           collapse to zero and a clipped line of the answer stays visible. */
        .faq-panel > * { overflow: hidden; min-height: 0; padding: 0; }
        .faq-panel.faq-open { grid-template-rows: 1fr; }

        /* Subtle entrance, and nothing at all for reduced-motion users */
        .reveal { animation: reveal .5s ease both; }
        .reveal-2 { animation: reveal .5s ease .08s both; }
        @keyframes reveal { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

        /* Scroll-triggered reveal, low amplitude, fires once per element. */
        .reveal-onscroll { opacity: 0; transform: translateY(14px); transition: opacity .55s ease, transform .55s ease; }
        .reveal-onscroll.is-in { opacity: 1; transform: none; }

        @media (prefers-reduced-motion: reduce) {
            .reveal, .reveal-2 { animation: none; }
            .reveal-onscroll { opacity: 1; transform: none; transition: none; }
            .faq-panel { transition: none; }
            html { scroll-behavior: auto; }
        }

        /* Mobile sticky CTA. Most traffic arrives from SMS on a phone. */
        .mobile-cta {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 45;
            background: rgba(255,255,255,.95); backdrop-filter: blur(10px);
            border-top: 1px solid #E6E9ED;
            padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
        }
        @media (min-width: 768px) { .mobile-cta { display: none; } }
        /* Keep the sticky bar from covering the end of the page. */
        @media (max-width: 767px) { .pad-for-cta { padding-bottom: 84px; } }

        /* =========================================================
           AGENT RECRUITING  (/aca-agent-recruiting)
           Marketing type scale throughout. Only the form controls
           need a class of their own: the light site has no input
           style yet, and .lv-filter is sized for a data grid.
           ========================================================= */
        .rc-input {
            display: block; width: 100%;
            background-color: #fff; color: #111827;
            border: 1px solid #E6E9ED; border-radius: 10px;
            font-size: 16px; line-height: 1.4;              /* 16px: no iOS zoom on focus */
            padding: 12px 14px;
            transition: border-color .18s ease;
        }
        .rc-input::placeholder { color: #667085; }
        .rc-input:hover { border-color: #D3D8DE; }
        .rc-input:focus-visible { outline: 2px solid #087F5B; outline-offset: 2px; border-color: #087F5B; }
        select.rc-input {
            appearance: none; -webkit-appearance: none;
            padding-right: 40px;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none'><path d='M4 6l4 4 4-4' stroke='%23667085' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'/></svg>");
            background-repeat: no-repeat; background-position: right 14px center; background-size: 15px 15px;
        }
        .rc-label { display: block; font-size: 14px; font-weight: 600; color: #111827; margin-bottom: 6px; }

        /* Two-column price rows. No header row: the cells are the table. */
        .rc-table { width: 100%; border-collapse: collapse; }
        .rc-table td { padding: 16px 0; border-bottom: 1px solid #E6E9ED; vertical-align: baseline; }
        .rc-table tr:last-child td { border-bottom: 0; }
        .rc-table td + td { text-align: right; white-space: nowrap; padding-left: 16px; }

        /* Full-width band above the hero. The height is reserved even when
           the band has nothing to say, so the hero never shifts. */
        .rc-band { min-height: 46px; display: flex; align-items: center; justify-content: center; }

        /* =========================================================
           STATE LICENSING VALUE TOOL  (/licensing-value)
           A high-density grid, not a marketing section. The type
           scale above is deliberately large for a page read in five
           seconds; fifty rows need smaller steps, so this layer
           defines its own — from the same tokens, no new hues.

           Desktop target is 1440x900 with no vertical scroll. Fifty
           rows in ONE column cannot meet that at legible type (it
           works out to ~12px a row), so at >=1280px the grid runs as
           two columns of 25. Nothing is paginated and nothing hides.
           ========================================================= */

        /* Ramp hue = brandgreen #10B981, the one brand green, varied
           only by alpha. Declared once so no component invents its own. */
        .lv-page { --lv-ramp: 16 185 129; }

        /* The tool owns the viewport under the sticky header, which measures
           67px: h-[66px] on the inner row plus the header's own 1px border. */
        @media (min-width: 1280px) {
            .lv-shell { height: calc(100vh - 67px); display: flex; flex-direction: column; }
            .lv-grids { flex: 1 1 auto; min-height: 0; }

            /* The tables fill the height the flex column hands them and share
               it out across their own rows, so the grid fits without a
               scrollbar on a short laptop as well as on a 900px desktop and
               nothing has to know how tall the header happens to be. */
            .lv-grids { align-items: stretch; }
            .lv-grids table { height: 100%; }
            .lv-grids .lv-table tbody td { height: 16px; }
        }

        /* Title, the primary control and search on one line. */
        .lv-head { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 18px; }
        .lv-title {
            font-size: 20px; font-weight: 700; letter-spacing: -0.022em;
            color: #111827; line-height: 1.2; margin: 0;
        }
        .lv-search { position: relative; }
        .lv-legend { font-size: 11px; color: #667085; display: flex; align-items: center; gap: 5px; margin-left: auto; }
        .lv-sub { font-size: 13px; line-height: 1.45; color: #667085; margin-top: 7px; max-width: 78rem; }
        .lv-fine { font-size: 11px; line-height: 1.4; color: #667085; margin-top: 5px; }

        /* ---- Resident-state selector: the primary control ----
           Same 10px radius and #E6E9ED line as .btn-secondary, sized
           up a step so it reads as the main input, not a footnote. */
        .lv-select {
            appearance: none; -webkit-appearance: none;
            background-color: #ECFDF5;                       /* mint */
            color: #064e3b;                                  /* brand.900 */
            border: 1.5px solid #10B981;                     /* brandgreen */
            border-radius: 10px;
            font-size: 15px; font-weight: 650; letter-spacing: -0.01em;
            padding: 8px 36px 8px 12px;
            box-shadow: 0 1px 2px rgba(16,24,40,.05);
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 15px 15px;
            transition: border-color .18s ease, box-shadow .18s ease;
        }
        .lv-select:hover { background-color: #d1fae5; }   /* brand.100 */
        .lv-select:focus-visible {
            outline: 2px solid #087F5B;                      /* deepgreen */
            outline-offset: 2px; border-color: #087F5B;
        }

        /* ---- Text filter ---- */
        .lv-filter {
            background-color: #fff; color: #111827;
            border: 1px solid #E6E9ED; border-radius: 10px;
            font-size: 13px; font-weight: 500;
            padding: 7px 11px 7px 30px; width: 212px;
            transition: border-color .18s ease;
        }
        .lv-filter::placeholder { color: #667085; font-weight: 400; }   /* muted */
        .lv-filter:hover { border-color: #D3D8DE; }
        .lv-filter:focus-visible { outline: 2px solid #087F5B; outline-offset: 2px; border-color: #087F5B; }

        /* ---- The grid ---- */
        .lv-table { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; }
        .lv-table caption {
            position: absolute; width: 1px; height: 1px;
            overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
        }

        .lv-table thead th {
            position: sticky; top: 0; z-index: 1;
            background: #F8FAF9;                             /* soft */
            border-bottom: 1px solid #E6E9ED;
            padding: 0; height: 34px;
            font-size: 10.5px; font-weight: 600;
            letter-spacing: 0.045em; text-transform: uppercase;
            color: #667085;                                  /* muted */
            text-align: right; vertical-align: bottom;
        }
        .lv-table thead th.lv-al { text-align: left; }

        /* Each header is a real button, so sorting is keyboard-reachable. */
        .lv-sort {
            display: flex; align-items: center; gap: 3px;
            width: 100%; height: 34px; padding: 0 7px 4px;
            justify-content: flex-end;
            font: inherit; color: inherit; letter-spacing: inherit;
            text-transform: inherit; background: none; border: 0;
            cursor: pointer; transition: color .15s ease;
        }
        .lv-al .lv-sort { justify-content: flex-start; }
        .lv-lbl { text-align: right; line-height: 1.2; }
        .lv-al .lv-lbl { text-align: left; }
        .lv-sort:hover { color: #111827; }
        .lv-sort:focus-visible { outline: 2px solid #087F5B; outline-offset: -2px; border-radius: 4px; }
        .lv-sort.is-active { color: #087F5B; }
        .lv-caret { font-size: 8px; line-height: 1; }

        .lv-table tbody td {
            height: 23px; padding: 0 7px; line-height: 1.3;
            border-bottom: 1px solid #F1F3F5;
            font-size: 11.5px; color: #111827;
            text-align: right; white-space: nowrap;
            overflow: visible;
        }
        .lv-table tbody td.lv-al { text-align: left; }
        .lv-table tbody tr:last-child td { border-bottom: 0; }
        .lv-table tbody tr:hover td { background-color: #F8FAF9; }     /* soft */
        .lv-rank { color: #667085; font-size: 10.5px; }
        .lv-name { font-weight: 550; letter-spacing: -0.01em; }
        .lv-dim  { color: #667085; }

        /* The value index. The tint is redundant to the number printed
           on top of it — colour is never the only carrier of meaning. */
        .lv-index { font-weight: 650; letter-spacing: -0.02em; }

        /* Every figure is somebody else's published number, and the row says
           so: the state name is a link to the schedule it came from. Styled to
           sit quiet at rest so 50 of them do not read as a wall of links. */
        .lv-src { color: inherit; text-decoration: none; }
        .lv-src:hover { text-decoration: underline; text-underline-offset: 2px; color: #087F5B; }
        .lv-src:focus-visible { outline: 2px solid #087F5B; outline-offset: 1px; border-radius: 3px; }

        .lv-swatch {
            display: inline-block; width: 14px; height: 9px;
            border-radius: 2px; border: 1px solid #E6E9ED; vertical-align: -1px;
        }

        /* ---- Pending-confirmation marker ----
           A dagger, not a colour: the glyph carries the meaning and
           the tooltip carries the explanation. */
        .lv-flag {
            font-size: 10px; line-height: 1; color: #667085;   /* muted */
            cursor: help; border: 0; background: none; padding: 0 0 0 3px;
            vertical-align: 1px;
        }
        .lv-flag:focus-visible { outline: 2px solid #087F5B; outline-offset: 1px; border-radius: 3px; }

        /* ---- Tooltip ---- */
        .lv-tipwrap { position: relative; display: inline-block; }
        .lv-tip {
            position: absolute; bottom: calc(100% + 6px); left: -8px; z-index: 30;
            width: min(236px, calc(100vw - 32px)); padding: 8px 10px;
            background: #111827;                              /* ink */
            color: #fff; border-radius: 8px;
            font-size: 11px; font-weight: 450; line-height: 1.45;
            letter-spacing: 0; text-align: left; text-transform: none;
            white-space: normal; pointer-events: none;
            opacity: 0; transform: translateY(2px);
            transition: opacity .14s ease, transform .14s ease;
            box-shadow: 0 1px 2px rgba(16,24,40,.05), 0 10px 30px -14px rgba(16,24,40,.14);
        }
        .lv-tipwrap:hover .lv-tip,
        .lv-tipwrap:focus-within .lv-tip { opacity: 1; transform: translateY(0); }
        /* Rows near the top of the grid open their tooltip downward. */
        .lv-tip.lv-tip-below { bottom: auto; top: calc(100% + 6px); transform: translateY(-2px); }
        .lv-tipwrap:hover .lv-tip-below,
        .lv-tipwrap:focus-within .lv-tip-below { transform: translateY(0); }

        /* ---- Mobile card layout ---- */
        .lv-card { background: #fff; border: 1px solid #E6E9ED; border-radius: 12px; padding: 12px 13px; }
        .lv-card + .lv-card { margin-top: 8px; }

        /* Selector stays reachable while the cards scroll. */
        .lv-sticky-select {
            position: sticky; top: 67px; z-index: 20;
            background: rgba(255,255,255,.95); backdrop-filter: blur(10px);
            border-bottom: 1px solid #E6E9ED;
            margin: 0 -20px; padding: 12px 20px;
        }
        @media (min-width: 768px) {
            .lv-sticky-select {
                position: static; margin: 0; padding: 0;
                border-bottom: 0; background: none; backdrop-filter: none;
            }
        }
        /* Below the tablet break the header row generates no box of its own, so
           the sticky selector resolves against .lv-shell -- which is as tall as
           the whole card list -- instead of against a 40px row it would scroll
           straight out of. */
        @media (max-width: 767px) {
            .lv-head { display: contents; }
            .lv-title { font-size: 22px; }
        }

        .sr-only {
            position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
            overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
        }
    </style>

<body class="bg-white text-ink min-h-screen antialiased selection:bg-brandgreen selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Security Utility: XSS Input Sanitization
        const sanitizeString = (str) => {
            if (!str) return '';
            return str.replace(/[&<>"'/]/g, (s) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;',
                '/': '&#x2F;'
            })[s]);
        };

        // Server Configured Products Registry
        const INITIAL_DB_PRODUCTS = [
            { 
                id: 'prod_fe',
                code: 'FINAL_EXPENSE',
                name: 'Final Expense Life Insurance', 
                fee: 199, 
                tagline: 'Burial & Final Expense Callers',
                description: 'Inbound senior citizens calling directly to request burial and funeral insurance quotes.',
                features: ['12-18 min average call length', 'High purchase intent seniors', '100% TCPA opt-in verified consent'],
                status: 'ACTIVE'
            },
            {
                id: 'prod_med',
                code: 'MEDICARE',
                name: 'Medicare Advantage & Supplement',
                fee: 125,
                tagline: 'Eligible Medicare Beneficiaries',
                description: 'Inbound beneficiaries looking to compare plan benefits during AEP, SEP, or Turning-65 windows.',
                features: ['CMS disclaimer compliant', 'SOA & call recording friendly', 'Matched to the states you select'],
                status: 'ACTIVE'
            },
            { 
                id: 'prod_aca',
                code: 'ACA_HEALTH',
                name: 'ACA Health Insurance', 
                fee: 100, 
                tagline: 'Individual & Family Marketplace Shoppers',
                description: 'Inbound health insurance shoppers seeking federal subsidy qualification and plan enrollment.',
                features: ['Subsidy eligible consumers', 'Year-round OEP/SEP inbound calls', 'Fast 8-12 minute average enrollment'],
                status: 'ACTIVE'
            }
        ];

        // Entity types an agency is likely to be registered as. "Other" exists so
        // nobody is forced into a wrong answer to get through the form.
        const ENTITY_TYPES = [
            'Sole Proprietorship',
            'Single-Member LLC',
            'LLC',
            'S Corporation',
            'C Corporation',
            'Partnership',
            'Other'
        ];

        const ALL_US_STATES = [
            'AL', 'AK', 'AZ', 'AR', 'CA', 'CO', 'CT', 'DE', 'FL', 'GA',
            'HI', 'ID', 'IL', 'IN', 'IA', 'KS', 'KY', 'LA', 'ME', 'MD',
            'MA', 'MI', 'MN', 'MS', 'MO', 'MT', 'NE', 'NV', 'NH', 'NJ',
            'NM', 'NY', 'NC', 'ND', 'OH', 'OK', 'OR', 'PA', 'RI', 'SC',
            'SD', 'TN', 'TX', 'UT', 'VT', 'VA', 'WA', 'WV', 'WI', 'WY'
        ];

        // Final-expense only. Every answer describes what this application
        // actually does. Nothing here asserts a rate, a rule, or a regulatory
        // position that is not in INITIAL_DB_PRODUCTS or the onboarding steps.
        const FAQS = [
            {
                q: "How are charges recorded?",
                a: "Billing occurs when an agent submits a completed application for an inbound consumer delivered through the NetEnroll platform."

        function useInView(threshold = 0.2) {
            const ref = useRef(null);
            const [inView, setInView] = useState(false);
            useEffect(() => {
                const el = ref.current;
                if (!el) return;
                if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { setInView(true); return; }
                const obs = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting) { setInView(true); obs.disconnect(); }
                }, { threshold });
                obs.observe(el);
                return () => obs.disconnect();
            }, []);
            return [ref, inView];
        }

        // Counts from 0 to `value` once `active` is true. Reduced-motion
        // visitors, and anyone re-rendering after the count already ran,
        // just get the target number with no animation.
        function useCountUp(value, active, duration = 900) {
            const [display, setDisplay] = useState(0);
            const done = useRef(false);
            useEffect(() => {
                if (!active || done.current) return;
                if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                    setDisplay(value); done.current = true; return;
                }
                done.current = true;
                const start = performance.now();
                let frame;
                const tick = (now) => {
                    const t = Math.min(1, (now - start) / duration);
                    setDisplay(value * (1 - Math.pow(1 - t, 3)));
                    if (t < 1) frame = requestAnimationFrame(tick);
                };
                frame = requestAnimationFrame(tick);
                return () => cancelAnimationFrame(frame);
            }, [active, value, duration]);
            return display;
        }

        /* ---- Formatters. Tabular numerals come from .num. ---- */
        const lvInt = new Intl.NumberFormat('en-US');
        const lvMoney = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2, maximumFractionDigits: 2 });
        /* Four places, not two: at two decimals every row reads $0.00
           and the column that justifies this page becomes useless. */
        const lvIndexFmt = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 4, maximumFractionDigits: 4 });

        /* ---- Fee resolution, exactly the order the data spec sets ----
           A schedule that is missing the resident state is a data error,
           not a cue to fall back: the published retaliatory schedules do
           not follow any arithmetic rule, so a guess would be a wrong
           number wearing a confident face. Throw, and let the caller
           surface it. */
        function lvResolveStateFee(data, residentCode, target) {
            const schedule = data.retaliatorySchedules[target.code];
            if (schedule) {
                const fee = schedule[residentCode];
                if (typeof fee !== 'number') {
                    throw new Error(
                        'Retaliatory schedule for ' + target.code +
                        ' has no entry for resident state ' + residentCode + '.'
                    );
                }
                return { fee, source: 'schedule' };
            }
            if (typeof target.flatFee !== 'number') {
                throw new Error(
                    target.code + ' has neither a retaliatory schedule nor a base fee.'
                );
            }
            return { fee: target.flatFee, source: 'flat' };
        }

        /* Build every row for one resident state. The resident state is
           excluded outright — an agent does not buy a non-resident
           license at home. */
        function lvBuildRows(data, residentCode) {
            const rows = [];
            data.jurisdictions.forEach(j => {
                if (j.code === residentCode) return;
                const noteKeys = (data.noteRefs && data.noteRefs[j.code]) || [];
                const base = {
                    code: j.code,
                    name: j.name,
                    seniorPop: j.seniorPopulation55to80,
                    niprFee: data.niprTransactionFee,
                    upperBound: !!j.prorated,
                    perLoa: !!j.perLineOfAuthority,
                    sourceUrl: j.sourceUrl,
                    lastVerified: j.lastVerified,
                    notes: noteKeys.map(k => data.notes[k]).filter(Boolean)
                };
                try {
                    const { fee, source } = lvResolveStateFee(data, residentCode, j);
                    const totalFee = fee + data.niprTransactionFee;
                    rows.push(Object.assign(base, {
                        stateFee: fee,
                        feeSource: source,
                        totalFee,
                        index: totalFee / (j.seniorPopulation55to80 / 1000),
                        error: null
                    }));
                } catch (err) {
                    rows.push(Object.assign(base, {
                        stateFee: null, feeSource: null, totalFee: null,
                        index: null, error: err.message
                    }));
                }
            });

            /* Rank is the standing by value index, cheapest first. It is
               deliberately independent of the active sort, so sorting by
               state name still shows each state's place. */
            const ranked = rows.filter(r => r.error === null)
                               .slice()
                               .sort((a, b) => a.index - b.index);
            ranked.forEach((r, i) => { r.rank = i + 1; });
            rows.filter(r => r.error !== null).forEach(r => { r.rank = null; });
            return rows;
        }

        /* Tint scale for the value-index column. Alpha only, over the one
           brand green. Computed across the FULL row set rather than the
           filtered one, so typing in the filter never re-colours the
           states left on screen. Log-compressed because the raw spread is
           heavily skewed — the small-population states run orders of
           magnitude above the median and would otherwise flatten
           everything else to one indistinguishable wash. */
        function lvRampScale(rows) {
            const vals = rows.filter(r => r.index > 0).map(r => r.index);
            if (!vals.length) return () => 0;
            const lo = Math.log(Math.min.apply(null, vals));
            const hi = Math.log(Math.max.apply(null, vals));
            const span = hi - lo;
            return v => {
                if (!(v > 0)) return 0;
                const t = span > 0 ? (Math.log(v) - lo) / span : 0;
                return +(0.04 + 0.26 * (1 - t)).toFixed(3);
            };
        }

        /* Records older than 180 days need re-checking; these fees change
           without notice. Surfaced in the admin portal, not here. */
        const LICENSING_STALE_DAYS = 180;
        function lvStaleRecords(data, now) {
            if (!data) return [];
            const cutoff = (now || Date.now()) - LICENSING_STALE_DAYS * 864e5;
            return data.jurisdictions
                .filter(j => {
                    const t = Date.parse(j.lastVerified);
                    return !isFinite(t) || t < cutoff;
                })
                .map(j => ({ code: j.code, name: j.name, lastVerified: j.lastVerified }));
        }

        /* Loads and shape-checks the fee file. nginx answers an unknown
           path with index.html, so a 200 here is not proof of JSON —
           validate before trusting it. */
        function useLicensingFees(active, nonce) {
            const [state, setState] = useState({ data: null, loading: false, error: null });
            useEffect(() => {
                if (!active || state.data || state.loading) return;
                let cancelled = false;
                setState({ data: null, loading: true, error: null });
                fetch(LICENSING_DATA_URL, { headers: { 'Accept': 'application/json' } })
                    .then(res => {
                        if (!res.ok) throw new Error('The fee table returned HTTP ' + res.status + '.');
                        return res.text();
                    })
                    .then(text => {
                        let parsed;
                        try { parsed = JSON.parse(text); }
                        catch (e) { throw new Error('The fee table did not parse as JSON.'); }
                        if (!parsed || !Array.isArray(parsed.jurisdictions) || !parsed.jurisdictions.length
                            || typeof parsed.niprTransactionFee !== 'number' || !parsed.retaliatorySchedules) {
                            throw new Error('The fee table is missing required fields.');
                        }
                        if (!cancelled) setState({ data: parsed, loading: false, error: null });
                    })
                    .catch(err => { if (!cancelled) setState({ data: null, loading: false, error: err.message }); });
                return () => { cancelled = true; };
            }, [active, nonce]);
            return state;
        }

        /* A focusable marker plus a tooltip. The glyph, not the colour,
           is what says "not confirmed"; the tooltip says why. */
        const LvNote = ({ label, body, below = false }) => (
            <span className="lv-tipwrap">
                <button type="button" className="lv-flag num" aria-label={label}>*</button>
                <span role="tooltip" className={below ? 'lv-tip lv-tip-below' : 'lv-tip'}>{body}</span>
            </span>
        );

        const LV_COLUMNS = [
            { key: 'rank',      label: 'Rank',                  align: 'right', width: '36px'  },
            { key: 'name',      label: 'State',                 align: 'left',  width: 'auto'  },
            { key: 'seniorPop', label: 'Ages 55–80 Population', align: 'right', width: '92px' },
            { key: 'stateFee',  label: 'State Fee',             align: 'right', width: '68px'  },
            { key: 'niprFee',   label: 'NIPR Fee',              align: 'right', width: '62px'  },
            { key: 'totalFee',  label: 'Total Fee',             align: 'right', width: '68px'  },
            { key: 'index',     label: 'Cost per 1,000 Seniors', align: 'right', width: '104px' }
        ];

        function LicensingValueTool({ data, loading, error, onRetry }) {
            /* Resident state survives a reload. Read once, lazily, so a
               blocked localStorage never breaks first paint. */
            const [residentState, setResidentState] = useState(() => {
                try {
                    const saved = window.localStorage.getItem(LICENSING_STORAGE_KEY);
                    if (saved && /^[A-Z]{2}$/.test(saved)) return saved;
                } catch (e) { /* private mode, blocked storage — fall through */ }
                return 'TX';
            });
            const [sort, setSort] = useState({ key: 'index', dir: 'asc' });
            const [filter, setFilter] = useState('');

            useEffect(() => {
                try { window.localStorage.setItem(LICENSING_STORAGE_KEY, residentState); }
                catch (e) { /* nothing to do; the page still works */ }
            }, [residentState]);

            const jurisdictions = data ? data.jurisdictions : [];

            /* If the saved code is not in the file, fall back rather than
               render an empty grid against a state that does not exist. */
            const effectiveResident = React.useMemo(() => {
                if (!jurisdictions.length) return residentState;
                if (jurisdictions.some(j => j.code === residentState)) return residentState;
                return jurisdictions[0].code;
            }, [jurisdictions, residentState]);

            const rows = React.useMemo(
                () => (data ? lvBuildRows(data, effectiveResident) : []),
                [data, effectiveResident]
            );
            const rampAlpha = React.useMemo(() => lvRampScale(rows), [rows]);

            const residentName = React.useMemo(() => {
                const j = jurisdictions.find(x => x.code === effectiveResident);
                return j ? j.name : effectiveResident;
            }, [jurisdictions, effectiveResident]);

            const visible = React.useMemo(() => {
                const q = filter.trim().toLowerCase();
                const out = rows.filter(r =>
                    !q || r.name.toLowerCase().includes(q) || r.code.toLowerCase().includes(q)
                );
                const dir = sort.dir === 'asc' ? 1 : -1;
                return out.slice().sort((a, b) => {
                    if (sort.key === 'name') return a.name.localeCompare(b.name) * dir;
                    /* Unresolvable rows sink to the bottom either way —
                       they have no number to sort on. */
                    const av = a[sort.key], bv = b[sort.key];
                    if (av == null && bv == null) return a.name.localeCompare(b.name);
                    if (av == null) return 1;
                    if (bv == null) return -1;
                    if (av === bv) return a.name.localeCompare(b.name);
                    return (av - bv) * dir;
                });
            }, [rows, filter, sort]);

            const toggleSort = (key) => {
                setSort(prev => prev.key === key
                    /* Same column: flip. New column: start ascending,
                       except the two that read better largest-first. */
                    ? { key, dir: prev.dir === 'asc' ? 'desc' : 'asc' }
                    : { key, dir: key === 'seniorPop' ? 'desc' : 'asc' });
            };

            const unresolved = rows.filter(r => r.error !== null);
            const notedCount = rows.filter(r => r.notes.length > 0).length;
            const dataVerified = data ? data.lastVerified : '';

            /* Two columns of 25 at >=1280px. See the note in the
               stylesheet: fifty rows in one column cannot fit 1440x900
               at a legible row height, and the brief rules out both
               pagination and a scroll region before density. */
            const half = Math.ceil(visible.length / 2);
            const halves = [visible.slice(0, half), visible.slice(half)];

            const sortIndicator = (key) => {
                if (sort.key !== key) return null;
                return <span className="lv-caret" aria-hidden="true">{sort.dir === 'asc' ? '▲' : '▼'}</span>;
            };
            const ariaSort = (key) => (sort.key === key ? (sort.dir === 'asc' ? 'ascending' : 'descending') : 'none');

            const noteBody = (r) => r.notes.join(' ');
            const noteLabel = (r) => r.name + ': see note';

            // Provenance, per row. Every figure traces to a published NIPR or
            // state schedule; none of it is ours, and the page should not read
            // as though it were.
            const sourceLabel = (r) => 'Published fee schedule for ' + r.name
                + ' (verified ' + r.lastVerified + '), opens in a new tab';

            const renderHead = () => (
                <thead>
                    <tr>
                        {LV_COLUMNS.map(c => (
                            <th key={c.key} scope="col"
                                className={c.align === 'left' ? 'lv-al' : undefined}
                                style={{ width: c.width }}
                                aria-sort={ariaSort(c.key)}>
                                <button type="button"
                                        onClick={() => toggleSort(c.key)}
                                        className={sort.key === c.key ? 'lv-sort is-active' : 'lv-sort'}>
                                    <span className="lv-lbl">{c.label}</span>
                                    {sortIndicator(c.key)}
                                    <span className="sr-only">
                                        {sort.key === c.key
                                            ? ', sorted ' + (sort.dir === 'asc' ? 'ascending' : 'descending') + ', activate to reverse'
                                            : ', activate to sort by this column'}
                                    </span>
                                </button>
                            </th>
                        ))}
                    </tr>
                </thead>
            );

            const renderRow = (r, rowIdx) => (
                <tr key={r.code}>
                    <td className="lv-rank num">{r.rank == null ? '—' : r.rank}</td>
                    <td className="lv-al">
                        <a className="lv-name lv-src" href={r.sourceUrl}
                           target="_blank" rel="noopener noreferrer"
                           title={sourceLabel(r)} aria-label={r.name + '. ' + sourceLabel(r)}>{r.name}</a>
                        {r.notes.length > 0 && (
                            <LvNote label={noteLabel(r)} body={noteBody(r)} below={rowIdx < 3} />
                        )}
                    </td>
                    <td className="num lv-dim">{lvInt.format(r.seniorPop)}</td>
                    <td className="num">{r.stateFee == null ? '—' : lvMoney.format(r.stateFee)}</td>
                    <td className="num lv-dim">{lvMoney.format(r.niprFee)}</td>
                    <td className="num">
                        {r.totalFee == null ? '—' : lvMoney.format(r.totalFee)}
                        {r.upperBound && <span className="sr-only"> (upper bound; the amount charged varies, see the note on this row)</span>}

            // The public marketing site is light mode. The authenticated portals
            // keep their existing dark surface, so chrome shared between them

            // dark one. isMarketing stays separate for the things that belong
            // to the landing page alone, such as the sticky phone CTA.
            const isPublic = currentTab === 'marketing' || currentTab === 'licensing' || currentTab === 'recruiting';
            const isMarketing = currentTab === 'marketing';

            /* ---- Real URLs for the two public routes ----
               nginx already answers an unknown path with index.html, so a path
               route needs no server change: read the path on mount, push it on
               navigation, and keep the document title in step. */
            const routeForPath = (p) => {
                if (p === LICENSING_ROUTE || p === LICENSING_ROUTE + '/') return 'licensing';
                if (p === RECRUITING_ROUTE || p === RECRUITING_ROUTE + '/') return 'recruiting';
                return 'marketing';
            };
            const pathForRoute = (tab) =>
                tab === 'licensing' ? LICENSING_ROUTE : tab === 'recruiting' ? RECRUITING_ROUTE : '/';

            useEffect(() => {
                setCurrentTab(routeForPath(window.location.pathname));
                const onPop = () => setCurrentTab(routeForPath(window.location.pathname));
                window.addEventListener('popstate', onPop);
                return () => window.removeEventListener('popstate', onPop);
            }, []);

            const navigateTo = (tab) => {
                const path = pathForRoute(tab);
                if (window.location.pathname !== path) window.history.pushState({}, '', path);
                setCurrentTab(tab);
                setMobileNavOpen(false);
                window.scrollTo({ top: 0 });
            };

            // Title, description and canonical follow the route, so a shared
            // link and a crawler both see the pair that matches the page.
            useEffect(() => {
                if (!isPublic) return;
                const meta = document.querySelector('meta[name="description"]');
                const canonical = document.querySelector('link[rel="canonical"]');
                const next = currentTab === 'licensing' ? LICENSING_META
                    : currentTab === 'recruiting' ? RECRUITING_META : HOME_META;
                document.title = next.title;
                if (meta) meta.setAttribute('content', next.description);
                if (canonical) canonical.setAttribute('href', 'https://netenroll.com' + pathForRoute(currentTab));
            }, [currentTab]);

            // The fee table is fetched only when the tool is actually open.
            const [feeNonce, setFeeNonce] = useState(0);
            const licensingFees = useLicensingFees(
                currentTab === 'licensing' || currentTab === 'admin', feeNonce);

            // These fees change without notice, so anything unverified for
            // more than 180 days is called out rather than trusted quietly.
            const staleFeeRecords = React.useMemo(
                () => lvStaleRecords(licensingFees.data, Date.now()),
                [licensingFees.data]);

            // The sticky phone CTA sat directly under the hero's own button on
            // first paint, which read as a duplicate. Reveal it once the hero
            // button is gone.
            const [showStickyCta, setShowStickyCta] = useState(false);
            useEffect(() => {
                if (!isMarketing) { setShowStickyCta(false); return; }
                const onScroll = () => setShowStickyCta(window.scrollY > 620);

                window.addEventListener('scroll', onScroll, { passive: true });
                return () => window.removeEventListener('scroll', onScroll);

            // Dynamic Database Products Registry
            const [dbProducts, setDbProducts] = useState(INITIAL_DB_PRODUCTS);

                if (!authorizeTenantAccess(agentId)) {

                                        <div className="space-y-2.5 font-mono text-xs">
                                            {auditLogs.map(a => (
                                                <div key={a.id} className="p-3 bg-slate-950 border border-slate-800 rounded-xl flex items-center justify-between">
                                                    <div className="space-y-0.5">
                                                        <div className="flex items-center gap-2">
                                                            <span className="text-purple-400 font-bold">{a.action}</span>
                                                            <span className="text-slate-500">• Target: {a.resource}</span>
                                                        </div>
                                                        <div className="text-slate-300 font-sans text-xs">{a.metadata}</div>
                                                    </div>
                                                    <div className="text-right text-[10px] text-slate-500">
                                                        <div>{a.timestamp}</div>
                                                        <div>{a.admin}</div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                            </div>
                        )}
                    </main>

                    {/* SUBMIT APPLICATION MODAL */}
                    {showAppModal && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-md w-full p-6 space-y-6 shadow-2xl">
                                <div className="flex items-center justify-between border-b border-slate-800 pb-4">
                                    <h3 className="text-base font-bold text-white flex items-center gap-2">
                                        <i className="fa-solid fa-file-circle-check text-emerald-400"></i> Log Policy Application
                                    </h3>
                                    <button onClick={() => setShowAppModal(false)} className="text-slate-400 hover:text-white">
                                        <i className="fa-solid fa-xmark text-lg"></i>
                                    </button>
                                </div>

                                {billingError && (
                                    <div className="p-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-xs flex items-center gap-2">
                                        <i className="fa-solid fa-triangle-exclamation"></i>
                                        <span>{billingError}</span>
                                    </div>
                                )}

                                <form onSubmit={handleAppSubmit} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">Insurance Carrier</label>
                                        <select value={appFormData.carrier} onChange={e => setAppFormData({...appFormData, carrier: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white outline-none focus:border-emerald-500">
                                            <option>Mutual of Omaha</option>
                                            <option>Aetna / Continental Life</option>
                                            <option>Humana</option>
                                            <option>Ambetter / Centene</option>
                                            <option>UnitedHealthcare</option>
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">Policy / Application Submission # *</label>
                                        <input type="text" required placeholder="e.g. FE-990421" value={appFormData.policyNumber} onChange={e => setAppFormData({...appFormData, policyNumber: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white outline-none focus:border-emerald-500 font-mono" />
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">Applicant First Name</label>
                                            <input type="text" required placeholder="Robert" value={appFormData.applicantFirstName} onChange={e => setAppFormData({...appFormData, applicantFirstName: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white outline-none focus:border-emerald-500" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">Applicant State</label>
                                            <input type="text" required placeholder="TX" value={appFormData.applicantState} onChange={e => setAppFormData({...appFormData, applicantState: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white outline-none focus:border-emerald-500 font-mono" />
                                        </div>
                                    </div>

                                    <div className="p-3 bg-emerald-500/10 border border-emerald-500/20 rounded-xl text-xs text-slate-300 space-y-1">
                                        <div className="font-bold text-emerald-400">Billing Notice:</div>
                                        <div>Submitting this application draws one application from your prepaid balance at ${FINAL_EXPENSE_FEE} per application.</div>
                                    </div>

                                    <button type="submit" disabled={isProcessingPayment} className="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-3.5 rounded-xl text-xs transition shadow-lg shadow-emerald-500/20 uppercase tracking-wider flex items-center justify-center gap-2">
                                        {isProcessingPayment ? (
                                            <>
                                                <i className="fa-solid fa-spinner fa-spin"></i>
                                                <span>Executing Stripe Charge...</span>
                                            </>
                                        ) : (
                                            <span>Confirm Policy Application Submission</span>
                                        )}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Mobile sticky CTA. Most traffic arrives from SMS on a phone,
                        so the primary action stays reachable without scrolling back. */}
                    {isMarketing && showStickyCta && (
                        <div className="mobile-cta">
                            <button onClick={startSignup} className="btn-primary w-full">
                                Start Receiving Calls
                            </button>
                        </div>
                    )}

                    {/* FOOTER */}
                    {isPublic ? (
                        <footer className={currentTab === 'licensing'
                            ? "border-t border-line bg-white xl:hidden"
                            : "border-t border-line bg-white"}>
                            <div className="max-w-[1180px] mx-auto px-5 sm:px-6 py-14">
                                <div className="grid gap-10 md:grid-cols-[1.4fr_1fr_1fr_1fr]">
                                    <div>
                                        <Wordmark className="h-[24px] w-auto" />
                                        <p className="mt-4 text-sm leading-relaxed text-muted max-w-xs">
                                            Performance-based final expense call distribution for licensed
                                            insurance professionals.
                                        </p>
                                    </div>

                                    <div>
                                        <h3 className="text-[13px] font-semibold text-ink">Products</h3>
                                        <ul className="mt-4 space-y-2.5 text-sm text-muted">
                                            <li><button onClick={() => scrollToSection('final-expense')} className="hover:text-ink transition-colors">Final Expense</button></li>
                                            <li><button onClick={() => navigateTo('recruiting')} className="hover:text-ink transition-colors">Agent Recruiting</button></li>
                                        </ul>
                                    </div>

                                    <div>
                                        <h3 className="text-[13px] font-semibold text-ink">Company</h3>
                                        <ul className="mt-4 space-y-2.5 text-sm text-muted">
                                            <li><button onClick={() => scrollToSection('how-it-works')} className="hover:text-ink transition-colors">How It Works</button></li>
                                            <li><button onClick={() => scrollToSection('pricing')} className="hover:text-ink transition-colors">Pricing</button></li>
                                            <li><button onClick={() => scrollToSection('faq')} className="hover:text-ink transition-colors">FAQ</button></li>
                                            <li><button onClick={() => scrollToSection('faq')} className="hover:text-ink transition-colors">Contact</button></li>
                                        </ul>
                                    </div>

                                    <div>
                                        <h3 className="text-[13px] font-semibold text-ink">Legal</h3>
                                        <ul className="mt-4 space-y-2.5 text-sm text-muted">
                                            <li><a href="/terms" className="hover:text-ink transition-colors">Terms of Service</a></li>
                                            <li><a href="/privacy" className="hover:text-ink transition-colors">Privacy Policy</a></li>
                                            <li><a href="/tcpa-compliance" className="hover:text-ink transition-colors">TCPA &amp; Compliance</a></li>
                                        </ul>
                                    </div>
                                </div>

                                <div className="mt-12 pt-7 border-t border-line flex flex-col sm:flex-row gap-3 sm:items-center sm:justify-between">
                                    <p className="text-[13px] text-muted">© 2026 PVN LLC. All rights reserved. NetEnroll is a service of PVN LLC.</p>
                                    <address className="not-italic text-[13px] text-muted sm:text-right">
                                        2800 N 6th Street #796, Saint Augustine, FL 32084
                                        <span className="hidden sm:inline"> &middot; </span>
                                        <a href="tel:+19045128487" className="block sm:inline hover:text-ink transition-colors">904-512-8487</a>
                                    </address>
                                </div>
                            </div>
                        </footer>
                    ) : (
                        <footer className="border-t border-slate-800 bg-slate-950 py-8 text-xs text-slate-500">
                            <div className="max-w-7xl mx-auto px-5 sm:px-6 flex flex-col sm:flex-row gap-2 sm:items-center sm:justify-between">
                                <span>© 2026 PVN LLC</span>
                                <button onClick={() => setCurrentTab('marketing')} className="hover:text-slate-300 transition-colors text-left">Back to netenroll.com</button>
                            </div>
                        </footer>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<NetEnrollApp />);
    </script>
</body>
</html>
